[package]
name = "stt-speakrs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Speaker diarization helper for the STT pipeline (speakrs, Core ML)"

[workspace]

[[bin]]
name = "stt-speakrs"
path = "src/main.rs"

[dependencies]
# Pinned exactly: the AHC 0.55 setting and the centroid rule in stt/speakrs_diar.py
# were benchmarked against this release. Re-run the bench before any bump.
speakrs = { version = "=0.7.0", default-features = false, features = ["coreml"] }
serde_json = "1"

[profile.release]
lto = "thin"
